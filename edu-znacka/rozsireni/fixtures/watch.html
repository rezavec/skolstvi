<!doctype html>
<!-- Zjednodušená stránka videa. Značka tu nepatří na náhled, ale za nadpis. -->
<html lang="cs" dark>
  <head>
    <meta charset="utf-8" />
    <title>Jak funguje gravitace — YouTube</title>
    <style>
      body { background: #0f0f0f; color: #fff; font-family: Roboto, sans-serif; margin: 0; padding: 16px; }
      #player { width: 640px; aspect-ratio: 16/9; background: #000; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      a { color: #aaa; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <ytd-watch-metadata>
      <h1 class="style-scope ytd-watch-metadata">
        <yt-formatted-string>Jak funguje gravitace</yt-formatted-string>
      </h1>
      <ytd-video-owner-renderer>
        <a href="/@fyzikanadosah">Fyzika na dosah</a>
      </ytd-video-owner-renderer>
    </ytd-watch-metadata>

    <h2>Další videa</h2>
    <div id="related">
      <ytd-compact-video-renderer>
        <a id="thumbnail" href="/watch?v=ccccccccccc">
          <img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="" />
        </a>
        <a id="video-title" href="/watch?v=ccccccccccc">Co nám zatajili o pyramidách</a>
        <ytd-channel-name><a href="/@zahadnysvet">Záhadný svět</a></ytd-channel-name>
      </ytd-compact-video-renderer>
    </div>
  </body>
</html>
